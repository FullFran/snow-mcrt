[project]
name = "snow-mcrt"
version = "0.1.0"
description = "Monte Carlo Ray Tracing for light propagation in snow, validated against published benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "miepython>=3.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow_mcrt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
