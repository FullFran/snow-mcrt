[project]
name = "snow-mcrt"
version = "0.1.0"
description = "Monte Carlo Ray Tracing for light propagation in snow, validated against published benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # Pinned exactly, not floated. The Mie table under data/mie/ is a committed
    # artifact carrying the solver version that produced it, and readers refuse
    # a table whose stamp does not match. A floating range would mean the
    # committed numbers are attributable to "some 3.x", which is not an
    # attribution -- and it would silently stop the table from ever being used.
    "miepython==3.2.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.0", "matplotlib>=3.7"]
# TARTES is an independent published implementation used only to cross-check
# results. The engine never imports it; its tests skip when it is absent.
validation = ["tartes>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow_mcrt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
